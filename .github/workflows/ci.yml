name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    # Every gate after Install runs even when an earlier one fails, so a single
    # pre-existing failure cannot hide the state of the others; the job still fails.
    steps:
      - uses: actions/checkout@v4
        with:
          # tests/integration/test_paper_release_gates.py asks whether each paper's
          # printed provenance commit still holds the inputs that paper reports. The
          # default shallow checkout has one commit, so every such pin would be
          # unverifiable and the gate would skip forever rather than ever fail.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        id: install
        run: python -m pip install -e ".[dev]" -r tools/requirements-formalpedia.txt
      - name: Ledger is generated
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python tools/render_theorem_ledger.py --check
      - name: Research references and output manifests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python tools/lab.py check
      - name: Preprints and publication kits
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python tools/preprints.py --check
      - name: Public Lean naming and documentation
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python tools/lean_style.py
      - name: Recorded axiom artifacts answer their checks
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python tools/axiom_audit.py --check
      - name: LEAN VERIFIED ledger rows name their declarations
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python tools/formalpedia.py ledger-check
      - name: Ruff (runtime, unused, repeated keys)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m ruff check .
      - name: Pyright (bt core)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m pyright src/bt
      - name: Pytest
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        # `-n auto --dist loadfile` is what pyproject.toml's addopts comment says to use for
        # the full suite; it is deliberately not in addopts because it spawns workers for
        # targeted runs too. This job IS the full suite, so it is the case that comment
        # describes. loadfile keeps one file on one worker, which matters where a module
        # builds shared state at import.
        run: pytest --runslow -n auto --dist loadfile

  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: "false"
      # lean-action appends $HOME/.elan/bin to GITHUB_PATH, so lake is on PATH
      # for the steps below. The gates here call lake and therefore skip on the
      # python job, which has no toolchain; without this step nothing in CI
      # enforces the Lean warning budget or regenerates the axiom artifacts.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]"
      # `lab.py build` compiles and then exports formalpedia metadata with all output in a
      # log file, so a runner that died mid-build left no trace. Compile first with streamed
      # output and resource samples; the export runs as its own step below.
      # The build ran the 16 GB runner out of memory near its end (samples reached
      # 15.8 GB) and the runner was killed. Swap on the free disk turns that peak into a
      # slowdown; the samples name the largest Lean processes so the module can be found.
      - name: Add swap for peak Lean memory
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 16G /mnt/btlab.swap
          sudo chmod 600 /mnt/btlab.swap
          sudo mkswap /mnt/btlab.swap
          sudo swapon /mnt/btlab.swap
          free -m
      - name: Build active Juggler and Collatz graph
        run: |
          (while true; do echo "::notice::$(date -u +%T) $(free -m | awk '/Mem:/{m=$3"/"$2} /Swap:/{s=$3} END{print "mem used/total MB " m " swap used MB " s}') $(df -h / | awk 'NR==2{print "disk used " $3 " of " $2}') top: $(ps -eo rss=,args= --sort=-rss | awk '{f=""; for(i=2;i<=NF;i++) if($i ~ /[.]lean$/) f=$i} f!="" && n++<3 {printf "%dMB %s; ", $1/1024, f}')"; sleep 60; done) &
          targets=$(python tools/lab.py build --list | sed 's/^/+/')
          cd formal && lake build $targets
      - name: Lean-dependent gates
        run: >
          pytest --runslow -q
          tests/tools/test_lean_hygiene.py
          tests/research/juggler_sequence/test_paper_a_trust_boundary.py
          tests/research/juggler_sequence/test_manuscript_self_audit.py
          tests/research/juggler_sequence/test_lean_interface_contracts.py
      # formalpedia quotes every AxiomCheck*.expected as a declaration's axiom audit; only
      # rerunning the checks shows that the recorded answers still describe current proofs.
      - name: Recorded axiom artifacts match fresh Lean output
        run: python tools/axiom_audit.py --run --workers 2
      # The compiled formalpedia layer (elaborated types, proof dependencies, collectAxioms)
      # otherwise exists only where someone built it by hand. Building it here keeps the
      # exporter working and publishes the snapshot for local and agent use.
      - name: Formalpedia semantic export
        if: ${{ !cancelled() }}
        run: python tools/lab.py build
      # The export records Lean's collectAxioms for every local declaration; every
      # declaration a LEAN VERIFIED ledger row names must carry only the axioms its
      # lean_trust allows.
      - name: LEAN VERIFIED ledger rows carry kernel-checked axioms
        run: python tools/formalpedia.py ledger-check --require-compiled
      - name: Upload formalpedia semantic snapshot
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: formalpedia-semantic
          path: .cache/formalpedia/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload build logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: lean-build-logs
          path: .build/formalpedia/
          if-no-files-found: ignore
          retention-days: 14
