name: Juggler companion

on:
  push:
    paths:
      - "web/juggler-companion/**"
      - "docs/theory/juggler_finite_dynamics*"
      - "docs/theory/paper_a_*"
      - "docs/theory/cochin-juggler.tex"
      - "tools/build_paper_a.py"
      - "tools/check_paper_a_numeric.py"
      - "src/research/juggler_sequence/paper_a_audit.py"
      - "tools/paper_a/**"
      - "formal/Problems/Juggler/**"
      - "formal/Problems/JugglerPaper.lean"
      - "formal/AxiomCheckPaperA.*"
      - "formal/lean-toolchain"
      - "formal/lake-manifest.json"
      - ".github/workflows/juggler-companion.yml"
  pull_request:
    paths:
      - "web/juggler-companion/**"
      - "docs/theory/juggler_finite_dynamics*"
      - "docs/theory/paper_a_*"
      - "docs/theory/cochin-juggler.tex"
      - "tools/build_paper_a.py"
      - "tools/check_paper_a_numeric.py"
      - "src/research/juggler_sequence/paper_a_audit.py"
      - "tools/paper_a/**"
      - "formal/Problems/Juggler/**"
      - "formal/Problems/JugglerPaper.lean"
      - "formal/AxiomCheckPaperA.*"
      - "formal/lean-toolchain"
      - "formal/lake-manifest.json"
      - ".github/workflows/juggler-companion.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/juggler-companion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/juggler-companion/package-lock.json
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        env:
          VITE_BASE: /balanced_ternary/
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: web/juggler-companion/dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
