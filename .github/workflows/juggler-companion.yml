name: Juggler companion

on:
  push:
    paths:
      - "web/juggler-companion/**"
      - "docs/theory/juggler_finite_dynamics*"
      - "docs/theory/paper_a_*"
      - "docs/theory/cochin-juggler.tex"
      - "tools/build_paper.py"
      - "tools/papers/a.json"
      - "tools/check_paper_a_numeric.py"
      - "src/research/juggler_sequence/paper_a_audit.py"
      - "tools/paper_a/**"
      - "formal/Problems/Juggler/**"
      - "formal/Problems/JugglerPaper.lean"
      - "formal/AxiomCheckPaperA.*"
      - "formal/lean-toolchain"
      - "formal/lake-manifest.json"
      - ".github/workflows/juggler-companion.yml"
  pull_request:
    paths:
      - "web/juggler-companion/**"
      - "docs/theory/juggler_finite_dynamics*"
      - "docs/theory/paper_a_*"
      - "docs/theory/cochin-juggler.tex"
      - "tools/build_paper.py"
      - "tools/papers/a.json"
      - "tools/check_paper_a_numeric.py"
      - "src/research/juggler_sequence/paper_a_audit.py"
      - "tools/paper_a/**"
      - "formal/Problems/Juggler/**"
      - "formal/Problems/JugglerPaper.lean"
      - "formal/AxiomCheckPaperA.*"
      - "formal/lean-toolchain"
      - "formal/lake-manifest.json"
      - ".github/workflows/juggler-companion.yml"
  workflow_dispatch:

# Tests and builds only: the site is deployed by Vercel (vercel.json), not GitHub Pages.
permissions:
  contents: read

concurrency:
  group: juggler-companion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/juggler-companion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/juggler-companion/package-lock.json
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      # Vercel deploys with the laboratory tree excluded (.vercelignore: /data/, /docs/, ...).
      # Build a copy of this folder alone so an import from outside it fails here, not there.
      - name: Build without the laboratory tree (as Vercel does)
        env:
          VERCEL: "1"
        run: |
          iso="$RUNNER_TEMP/iso/web/juggler-companion"
          mkdir -p "$iso"
          tar --exclude=node_modules --exclude=dist -cf - . | tar -xf - -C "$iso"
          cd "$iso"
          npm ci --no-audit --no-fund
          npm run build
