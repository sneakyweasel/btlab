[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "balanced-ternary"
version = "0.2.2"
description = "Juggler and Collatz mathematics, formal proofs, and reproducible research"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Balanced Ternary Mathematical Laboratory" }]
keywords = [
    "balanced-ternary",
    "exact-arithmetic",
    "lean4",
    "juggler",
    "collatz",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
]

# Imported unguarded by src/, so required for any install -- not just an extra.
# Both were absent from this table until 14 September 2026 and CI never noticed,
# because pip install -e ".[dev]" on a clean runner got neither and the suite had
# been failing earlier, at the ruff gate, for weeks. Locally they were present by
# accident: sympy depends on mpmath, and the development environment had sympy.
dependencies = [
    "mpmath>=1.3",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-xdist>=3",
    "ruff>=0.6",
    "hypothesis>=6.100",
    "pyright>=1.1",
    "sympy>=1.12",  # tools/derive_paper_b_review.py imports it unguarded
]
experiments = ["pyarrow>=14"]
atlas = ["pyarrow>=14", "duckdb>=1", "polars>=1"]
jev = ["typesafe-sdk>=0.7"]  # tools/formalpedia.py jev-propose / jev-calibrate; imported lazily

[project.scripts]
btlab = "cli.main:main"
juggler-atlas = "research.juggler_sequence.atlas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `-n auto --dist loadfile` is deliberately NOT here. Forcing it on every
# invocation spawned twelve execnet workers for a fifteen-test targeted run and
# rolled the worker-startup dice each time (see environment.mdc on
# `[gw0] node down`). Parallelise the full suite explicitly:
#     pytest -n auto --dist loadfile
# and leave targeted runs serial, where they are faster anyway.
addopts = "-q --import-mode=importlib"
markers = [
    "slow: exhaustive census or million-range identity",
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "tools"]
target-version = "py311"

[tool.ruff.lint]
# High-signal runtime / dict-key rules only. Do not enable the full
# default set: F401 alone is 60+ unused imports, mostly PARKED files.
select = ["E9", "F63", "F7", "F82", "F601", "F602", "F811", "F841", "B006"]

[tool.ruff.lint.isort]
known-first-party = ["bt", "research", "research_engine", "cli"]

[tool.pyright]
include = ["src/bt"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
